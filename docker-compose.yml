      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  pool-lowdataesc-service:
    build:
      context: ./services/pool-lowdataesc
      dockerfile: Dockerfile
    container_name: zela-pool-lowdataesc
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3013
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public,pool_lowdataesc
      REDIS_URL: redis://redis:6379
      POOL_NAME: pool-nacional
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3013:3013"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  # ============================================
  # Servicos de IA (Python FastAPI)
  # ============================================
  match-service:
    build:
      context: ./ai/match-service
      dockerfile: Dockerfile
    container_name: zela-match-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      PORT: 3003
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      API_KEY: zela-match-secret-change-in-production
      JWT_SECRET: zela-secret-key-change-in-production
      CACHE_ENABLED: "True"
      CACHE_TTL: 3600
      MODEL_DIR: ./models
      USE_GPU: "False"
      CONFIDENCE_THRESHOLD: 0.7
      HUMAN_REVIEW_THRESHOLD: 0.6
      MAX_INPUT_LENGTH: 10000
      MAX_BATCH_SIZE: 100
      CORS_ORIGINS: "['http://localhost:3000','http://localhost:3001','http://localhost:3002']"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3003/api/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  transcription-service:
    build:
      context: ./ai/transcription-service
      dockerfile: Dockerfile
    container_name: zela-transcription-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      PORT: 3014
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      MODEL_DIR: ./models
      USE_GPU: "False"
      WHISPER_MODEL: small
      CORS_ORIGINS: "['http://localhost:3000','http://localhost:3001','http://localhost:3002']"
    ports:
      - "3014:3014"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3014/api/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  classification-service-ai:
    build:
      context: ./ai/classification-service
      dockerfile: Dockerfile
    container_name: zela-classification-service-ai
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      PORT: 3015
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      MODEL_DIR: ./models
      USE_GPU: "False"
      LLM_MODEL: llama-3.1-70b
      CLIP_MODEL: ViT-B-32
      CORS_ORIGINS: "['http://localhost:3000','http://localhost:3001','http://localhost:3002']"
    ports:
      - "3015:3015"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3015/api/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  # ============================================
  # Storage (MinIO para S3 compativel)
  # ============================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T20-19-16Z
    container_name: zela-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zela_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zela-network

  # ============================================
  # API Gateway (Kong)
  # ============================================
  kong:
    image: kong:3.6-alpine
    container_name: zela-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: zela_user
      KONG_PG_PASSWORD: zela_password
      KONG_PG_DATABASE: zela_nacional
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zela-network

  # ============================================
  # Frontend (Next.js)
  # ============================================
  portal-cidadao:
    build:
      context: ./apps/portal-cidadao
      dockerfile: Dockerfile
    container_name: zela-portal-cidadao
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_ROUTING_URL: http://localhost:3002
      NEXT_PUBLIC_INTAKE_URL: http://localhost:3004
      NEXT_PUBLIC_MEDIA_URL: http://localhost:3005
      NEXT_PUBLIC_WHATSAPP_NUMBER: 5511999999999
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
      intake-service:
        condition: service_healthy
    networks:
      - zela-network

  portal-consorcio:
    build:
      context: ./apps/portal-consorcio
      dockerfile: Dockerfile
    container_name: zela-portal-consorcio
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost:3010
      NEXT_PUBLIC_ROUTING_URL: http://localhost:3002
    ports:
      - "3016:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - zela-network

  portal-prefeitura:
    build:
      context: ./apps/portal-prefeitura
      dockerfile: Dockerfile
    container_name: zela-portal-prefeitura
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_INTAKE_URL: http://localhost:3004
      NEXT_PUBLIC_WORKFLOW_URL: http://localhost:3007
      NEXT_PUBLIC_NOTIFICATION_URL: http://localhost:3009
    ports:
      - "3017:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      intake-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    networks:
      - zela-network

  portal-nacional:
    build:
      context: ./apps/portal-nacional
      dockerfile: Dockerfile
    container_name: zela-portal-nacional
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost:3010
      NEXT_PUBLIC_BILLING_URL: http://localhost:3011
      NEXT_PUBLIC_AUDIT_URL: http://localhost:3012
    ports:
      - "3018:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    networks:
      - zela-network

  crm:
    build:
      context: ./apps/crm
      dockerfile: Dockerfile
    container_name: zela-crm
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_ROUTING_URL: http://localhost:3002
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost:3010
      NEXT_PUBLIC_POOL_URL: http://localhost:3013
