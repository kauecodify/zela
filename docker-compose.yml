version: '3.8'

# Zela Nacional - Docker Compose para Desenvolvimento
# Orquestra todos os servicos: backend, frontend, IA, banco de dados

services:
  # ============================================
  # Banco de Dados
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: zela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zela_user
      POSTGRES_PASSWORD: zela_password
      POSTGRES_DB: zela_nacional
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
    ports:
      - "5432:5432"
    volumes:
      - zela_postgres_data:/var/lib/postgresql/data
      - ./infra/terraform/modules/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zela_user -d zela_nacional"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zela-network

  # Redis para cache e filas
  redis:
    image: redis:7-alpine
    container_name: zela-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - zela_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zela-network

  # OpenSearch para busca textual
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: zela-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - zela_opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - zela-network

  # ClickHouse para analytics
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: zela-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: zela_analytics
      CLICKHOUSE_USER: zela_user
      CLICKHOUSE_PASSWORD: zela_password
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - zela_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zela-network

  # ============================================
  # Servicos de Backend (NestJS)
  # ============================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: zela-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      DIRECT_DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      JWT_SECRET: zela-secret-key-change-in-production
      JWT_REFRESH_SECRET: zela-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  routing-service:
    build:
      context: ./services/routing-service
      dockerfile: Dockerfile
    container_name: zela-routing-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      DIRECT_DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      JWT_SECRET: zela-secret-key-change-in-production
      MATCH_API_URL: http://match-service:3003/api/match
      ENABLE_EXTERNAL_MATCH: "true"
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      match-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
