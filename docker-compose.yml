      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: zela-billing-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3011
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      REDIS_URL: redis://redis:6379
      PIX_API_KEY: pix-api-key
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zela-network

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: zela-audit-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3012
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007
      LOG_LEVEL: debug
    ports:
      - "3012:3012"
    depends_on:
      postgres:
