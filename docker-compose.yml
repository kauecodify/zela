      dockerfile: Dockerfile
    container_name: zela-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://zela_user:zela_password@postgres:5432/zela_nacional?schema=public
      REDIS_URL: redis://redis:6379
      WHATSAPP_API_KEY: whatsapp-api-key
      SMS_API_KEY: sms-api-key
      EMAIL_SMTP_HOST: smtp.gmail.com
      EMAIL_SMTP_PORT: 587
      EMAIL_USER: zela@email.com
